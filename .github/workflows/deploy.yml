name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  LLM_KEY: ${{ secrets.LLM_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  check-secrets:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      have: ${{ steps.check.outputs.have }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ORG" ] && [ -n "$PROJECT" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "All Vercel secrets present — deploy will run."
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets missing (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID). Deploy skipped; build remains green."
          fi

  deploy:
    needs: [build, check-secrets]
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      needs.check-secrets.outputs.have == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm i -g vercel@59.1.4

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build (production)
        run: vercel build --prod --yes --token=$VERCEL_TOKEN

      - name: Deploy to Production
        run: vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN

      - name: Comment deploy URL
        run: |
          echo "Deployment complete — see the Vercel project dashboard for the URL."